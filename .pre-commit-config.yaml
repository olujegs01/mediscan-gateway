repos:
- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
    - id: black
      language_version: python3.11
- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: stable
  hooks:
    - id: ruff
- repo: https://github.com/pre-commit/mirrors-isort
  rev: v5.12.0
  hooks:
    - id: isort
      name: isort
      language_version: python3.11
